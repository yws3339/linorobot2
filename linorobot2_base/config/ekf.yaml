ekf_filter_node:
    ros__parameters:
        frequency: 50.0
        two_d_mode: true
        publish_tf: true
 
        map_frame: map             
        odom_frame: odom            
        base_link_frame: base_footprint 
        world_frame: odom 

        #x     , y     , z,
        #roll  , pitch , yaw,
        #vx    , vy    , vz,
        #vroll , vpitch, vyaw,
        #ax    , ay    , az
        odom0: odom/unfiltered
        odom0_config: [false, false, false,
                       false, false, false,
                       true, true, false,
                       false, false, true,
                       false, false, false]

        imu0: imu/data
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]

        # twist0(옵티컬플로우)는 통째로 뺐다 — 센서가 실물에 없고, 그 노드가 무는
        # /dev/ttyTHS1 은 카메라붐 ESP32 의 포트다. 남은 입력은 odom0 + imu0.
        # 되살릴 때는 twist0_* 를 부분만 두지 말 것 — robot_localization 은
        # twist0 토픽 줄이 없으면 나머지 twist0_* 를 아예 안 읽어 조용히 무시한다.
