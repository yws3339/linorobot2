bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # 2WD diff drive는 y=0, 표준값으로 정리
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # yolo_speed_governor가 /speed_limit (nav2_msgs/SpeedLimit) 발행 → DWB가 자동으로 max_vel_x 조정
    speed_limit_topic: "speed_limit"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
    # RotationShim 우회: RPP 직접 사용 (use_rotate_to_heading: true로 큰 회전 자체 처리)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.5
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5      # 0.75 → 0.5 (over-rotation 감소)
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_theta: 0.1
      # 1Hz plan 갱신 시 RPP가 prev_angular_vel reset하는 동작 회피
      # 한 cycle(20ms) 내 0.75 rad/s 도달 가능하도록 50 적용 (실측 검증)
      max_angular_accel: 50.0
      use_collision_detection: true        # 안전 위해 복원
      max_robot_pose_search_dist: 10.0
      stateful: true
      use_interpolation: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # base_link=회전중심 기준: 뒷면 -0.075, 앞면 +0.395 (STL 470mm), 좌우 ±0.17m (트랙 294mm + 마진)
      footprint: "[[0.395, 0.17], [0.395, -0.17], [-0.075, -0.17], [-0.075, 0.17]]"
      plugins: ["stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0              # 동적 관측 1초 후 decay (군중 환경 최적화)
        decay_model: 0                # 0=linear
        voxel_size: 0.05
        track_unknown_space: true
        observation_persistence: 0.0
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        # 실물: RPLIDAR 360° + L515 PointCloud2 직접 입력
        # 시뮬: L515 PC2 미발행 시 자동 무시 (RPLIDAR만 동작)
        observation_sources: rplidar_mark l515_mark
        rplidar_mark:
          data_type: LaserScan
          topic: /scan
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: false
          voxel_filter: false
        l515_mark:
          data_type: PointCloud2
          topic: /camera/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.30   # 바닥 노이즈 제거
          max_obstacle_height: 1.5
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # base_link=회전중심 기준: 뒷면 -0.075, 앞면 +0.395 (STL 470mm), 좌우 ±0.17m (트랙 294mm + 마진)
      footprint: "[[0.395, 0.17], [0.395, -0.17], [-0.075, -0.17], [-0.075, 0.17]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 3.0             # global은 더 오래 기억 (정적 장애물 추적)
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        observation_persistence: 0.0
        max_obstacle_height: 2.0
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false      # global은 시각화 비활성화 (부하 절감)
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: rplidar_mark l515_mark
        rplidar_mark:
          data_type: LaserScan
          topic: /scan
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          inf_is_valid: false
          voxel_filter: false
        l515_mark:
          data_type: PointCloud2
          topic: /camera/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.30
          max_obstacle_height: 1.5
          inf_is_valid: false
          voxel_filter: true
          clear_after_reading: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 50.0
    scale_velocities: False
    feedback: "OPEN_LOOP"  # 시뮬에서는 OPEN_LOOP 권장 (실물 대리석 슬립 대응 시 CLOSED_LOOP로 변경)
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.0, 0.0, 25.0]           # angular 가속 5.0 → 25.0 (1 cycle 안 max 도달)
    max_decel: [-1.0, 0.0, -25.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
